[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitteam-python-sdk"
version = "1.7.0"
description = "Async BitTeam SDK with API keys, session auth, full REST catalog and market history"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.12,<4", "certifi>=2024.7.4"]

[project.urls]
Homepage = "https://github.com/maxwell2010/bitteam-python-sdk"
Repository = "https://github.com/maxwell2010/bitteam-python-sdk"
Issues = "https://github.com/maxwell2010/bitteam-python-sdk/issues"
Documentation = "https://github.com/maxwell2010/bitteam-python-sdk/blob/main/README.md"

[project.optional-dependencies]
charts = ["pandas>=2", "plotly>=5"]
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "cryptography>=43", "aiosqlite>=0.20", "build>=1", "pytest-cov>=5", "setuptools>=69", "PyYAML>=6,<7", "pandas>=2", "plotly>=5", "markdown-it-py>=3,<5", "tomli>=2,<3; python_version<'3.11'"]

[tool.setuptools.packages.find]
include = ["bitteam_sdk", "bitteam_sdk.storage", "bitteam_sdk.schemas"]

[tool.setuptools.package-data]
bitteam_sdk = ["schemas/*.json", "*.md", "LIVE_CHECKS.json", "EXTENDED_CHECKS.json"]
